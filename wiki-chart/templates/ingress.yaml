{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-ingress
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - http:
      paths:
      # Route /users/* to FastAPI
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: fastapi
            port:
              number: 8000
      # Route /posts/* to FastAPI
      - path: /posts
        pathType: Prefix
        backend:
          service:
            name: fastapi
            port:
              number: 8000
      # Route /grafana/* to Grafana
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
{{- end }}

